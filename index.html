body{margin:0}
#speakers{--navy:#022C42;--text:#3E4A50;--line:#CBD8DC}
#speakers :focus-visible{outline:3px solid #EB6317;outline-offset:3px}
#speakers .chip{font-family:inherit;font-size:1rem;font-weight:700;line-height:1.2;flex:none;white-space:nowrap;min-height:44px;padding:.5rem 1.1rem;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--navy);cursor:pointer}
#speakers .chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
#speakers .people{list-style:none;margin:0;padding:1.3rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:1rem}
#speakers .person{background:#EEF5F6;border-radius:10px;border-left:4px solid var(--accent);padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.25rem;min-width:0}
#speakers .person .name{font-size:1.125rem;line-height:1.3;font-weight:700;color:var(--navy)}
#speakers .person .role{font-size:1rem;line-height:1.4;color:var(--text)}
#speakers .also{margin:0 1.3rem 1.3rem;padding:.2rem 0 .2rem .9rem;border-left:3px solid var(--accent);font-size:.9375rem;line-height:1.4;font-style:italic;color:#5A666C}
#speakers .also:first-child{margin-top:1.3rem}
#speakers .person .photo{width:64px;height:64px;border-radius:50%;object-fit:cover;border:1px solid var(--line);margin-bottom:.5rem}
</style>

  <div style="max-width:1080px;margin:0 auto;padding:0 clamp(1rem,4vw,2rem);box-sizing:border-box">
    <h2 style="color:#022C42;margin:0;line-height:1.12;font-size:clamp(1.8rem,4vw,2.75rem);font-weight:700">Meet the Tech Powerhouse speakers</h2>
    <div id="chips" role="group" aria-label="Filter by session" style="display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.6rem"></div>
    <div id="cards" style="display:flex;flex-direction:column;gap:1.1rem;margin-top:1.6rem"></div>
  </div>
</section>
<script>
// Add a `photo` (URL or data: URI) to any speaker to show an avatar above the name.
var SESSIONS=[
 {chip:"Kick-off",color:"#0080A6",title:"AI is now: Kick-off Session",speakers:[
  {name:"Axel Schell",role:"Chief Transformation Officer"},
  {name:"Prof. Dr. Johann Kranz",role:"LMU Munich School of Management"},
  {name:"Alexander Heinrich",role:"Head of Applications 2"}]},
 {chip:"AI Transformation",color:"#008483",title:"Enabling the Group\u2019s AI Transformation",speakers:[
  {name:"Sandra Volkanovska",role:"Head of R&D Hub"},
  {name:"Maria Huber",role:"Head of AI Factory"}]},
 {chip:"AI-Native Squads",color:"#022C42",title:"Reworking How We Build: AI-Native Squads & SDLC",speakers:[
  {name:"J\u00fcrgen Schlauch",role:"Head of AI Native Ways of Working, AI Factory"},
  {name:"Stefano D\u2019Acunzo",role:"Global Head of Platform Engineering, CIO-COO"}
  ],also:"Plus several frontrunners from across the globe!"},
 {chip:"Security & Resilience",color:"#EB6317",title:"Security & Digital Resilience: The Foundation that enables AI scale",speakers:[
  {name:"Andrew Gensler",role:"Chief Information Security Officer"}]},
 {chip:"Tech Entrepreneurs",color:"#0080A6",title:"Skills & Mindset, Made Visible: The Tech Entrepreneurs, Live",speakers:[
  {name:"Vicky Drakousis",role:"Chief People & Sustainability Officer"},
  {name:"Alexander Heinrich",role:"Head of Applications 2"},
  {name:"Jihan Nadri",role:"Chief Executive Officer, Allianz Technology Thailand"}
  ],also:"Plus colleagues from across Allianz Technology"}
];
var selected=0; // index of the session shown
function el(t,css,txt){var e=document.createElement(t);if(css)e.style.cssText=css;if(txt)e.textContent=txt;return e}
function render(){
  var chips=document.getElementById("chips");chips.textContent="";
  SESSIONS.forEach(function(s,idx){
    var b=el("button",null,s.chip);b.type="button";b.className="chip";
    b.setAttribute("aria-pressed",String(idx===selected));
    b.onclick=function(){selected=idx;render()};chips.appendChild(b);
  });
  var cards=document.getElementById("cards");cards.textContent="";
  SESSIONS.forEach(function(s,i){
    if(selected!==i)return;
    var card=el("div","background:#FFFFFF;border:1px solid #CBD8DC;border-radius:14px;overflow:hidden");
    var head=el("div","padding:1.1rem 1.3rem;color:#fff;background:"+s.color);
    head.appendChild(el("h3","color:#fff;margin:0;line-height:1.2;font-size:1.45rem",s.title));
    card.appendChild(head);
    var ul=el("ul");ul.className="people";ul.style.setProperty("--accent",s.color);
    s.speakers.forEach(function(p){
      var li=el("li");li.className="person";
      if(p.photo){var img=el("img");img.className="photo";img.src=p.photo;img.alt=p.name;li.appendChild(img)}
      li.appendChild(el("span",null,p.name)).className="name";
      if(p.role)li.appendChild(el("span",null,p.role)).className="role";
      ul.appendChild(li);
    });
    card.appendChild(ul);
    if(s.also){
      var note=el("div",null,s.also);note.className="also";note.style.setProperty("--accent",s.color);
      card.appendChild(note);
    }
    cards.appendChild(card);
  });
}
render();
</script>
